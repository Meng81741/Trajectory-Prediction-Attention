# MGFNet Default Configuration
# Multi-Level Attention Trajectory Prediction Model

model:
  # Input dimensions
  agent_input_dim: 6          # x, y, vx, vy, heading, timestamp
  lane_input_dim: 5           # x, y, dx, dy, lane_type
  hidden_dim: 128
  num_attention_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 4

  # Temporal attention
  history_steps: 20           # 2 seconds @ 10Hz
  temporal_dilations: [1, 2, 4]  # Multi-scale dilation rates

  # Cross-attention (agent ↔ map)
  num_map_layers: 3
  num_neighbor_layers: 3

  # Decoder
  num_modes: 6                # 6 multi-modal future trajectories
  future_steps: 30            # 3 seconds @ 10Hz
  mode_embedding_dim: 64

  # Dropout
  dropout: 0.1

data:
  data_dir: "data/argoverse"
  max_neighbors: 20
  max_lane_segments: 50
  lane_resolution: 5.0        # meters between lane nodes

training:
  batch_size: 64
  learning_rate: 0.001
  weight_decay: 0.0001
  epochs: 100
  warmup_epochs: 10
  gradient_clip: 1.0
  num_workers: 8

  # Loss weights
  regression_weight: 1.0
  diversity_weight: 0.1

evaluation:
  metrics: ["minADE", "minFDE", "MR"]
  mr_threshold: 2.0           # meters
